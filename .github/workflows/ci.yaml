name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build, validate, migrate and test an isolated database
        run: make ci

  # Deployment runs outside this public repository. When the maintainers'
  # secrets are configured, a tested push to main asks their private
  # deployment repository to deploy this exact commit. Forks skip it.
  request-deployment:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request deployment of the tested commit
        env:
          TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          TARGET: ${{ secrets.DEPLOY_REPOSITORY }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$TARGET" ]; then
            echo 'No deployment configured; nothing to do.'
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$TARGET/dispatches" \
            -d "{\"event_type\":\"deploy\",\"client_payload\":{\"sha\":\"$GITHUB_SHA\"}}"
          echo 'Deployment requested.'
