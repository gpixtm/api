name: gpix-ci
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gpix
      POSTGRES_USER: gpix
      POSTGRES_PASSWORD: ci-only-not-a-production-secret
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U gpix -d gpix']
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: gpix-ci-api
    build: .
    environment: &app-environment
      DB_HOST: db
      DB_PASSWORD: ci-only-not-a-production-secret
      APP_SECRET: ci-only-012345678901234567890123456789
      MAILER_DSN: smtp://mailpit:1025
      MAIL_FROM: gpix@example.test
    ports:
      - '127.0.0.1::80'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, bin/health.php]
      interval: 3s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - '127.0.0.1::8025'
  mail-worker:
    image: gpix-ci-api
    command: [php, bin/mail-worker.php]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
