services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set your public DNS name in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  certificates:
    name: gpix_certificates
  caddy_config:
    name: gpix_caddy_config
