name: gpix-prod

x-app: &app
  image: gpix-api:${GPIX_RELEASE:?Use make deploy}
  restart: unless-stopped
  environment:
    DB_HOST: db
    DB_PASSWORD: ${DB_PASSWORD:?Missing production secret}
    APP_SECRET: ${APP_SECRET:?Missing production secret}
    MAILER_DSN: ${MAILER_DSN:-}
    MAIL_FROM: ${MAIL_FROM:-}
    ELEVATION_URL: ${ELEVATION_URL:-}
    ROUTING_URL: ${ROUTING_URL:-https://valhalla1.openstreetmap.de/route}
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpix
      POSTGRES_USER: gpix
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Missing production secret}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U gpix -d gpix']
      interval: 3s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api:
    <<: *app
    build: .
    volumes:
      - ${GPIX_SHARED_DIR:?Use make deploy}/maps:/data/maps:ro
    networks:
      default:
      proxy:
        aliases: [gpix-api]
    healthcheck:
      test: [CMD, php, bin/health.php]
      interval: 5s
      timeout: 5s
      retries: 30
  mail-worker:
    <<: *app
    command: [php, bin/mail-worker.php]

volumes:
  database:
    external: true
    name: gpix_prod_database

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
